<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Firebase Google Login</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f5f5f5;
    }

    .card{
      width:350px;
      background:white;
      padding:30px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
      text-align:center;
    }

    h1{
      margin-bottom:20px;
      color:#222;
    }

    .google-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#fff;
      border:1px solid #ddd;
      cursor:pointer;
      font-size:16px;
      font-weight:600;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      transition:0.3s;
    }

    .google-btn:hover{
      background:#f2f2f2;
    }

    .google-icon{
      width:22px;
      height:22px;
    }

    .user-box{
      margin-top:25px;
      display:none;
    }

    .user-box img{
      width:80px;
      height:80px;
      border-radius:50%;
      margin-bottom:10px;
    }

    .logout-btn{
      margin-top:15px;
      padding:10px 20px;
      border:none;
      border-radius:8px;
      background:#ff4d4d;
      color:white;
      cursor:pointer;
      font-weight:bold;
    }

    .logout-btn:hover{
      background:#e63939;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Google Sign In</h1>

    <button class="google-btn" id="loginBtn">
      <img class="google-icon"
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
      Sign in with Google
    </button>

    <div class="user-box" id="userBox">
      <img id="userPhoto" src="">
      <h2 id="userName"></h2>
      <p id="userEmail"></p>

      <button class="logout-btn" id="logoutBtn">
        Logout
      </button>
    </div>
  </div>

  <script type="module">
    // Firebase SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyBw1Rfo-MX_7Z4N8BlYuhgxaSJb5p1za5o",
      authDomain: "firstweb-aea54.firebaseapp.com",
      projectId: "firstweb-aea54",
      storageBucket: "firstweb-aea54.firebasestorage.app",
      messagingSenderId: "29706951833",
      appId: "1:29706951833:web:41e1bf9fa0ef9c60ee2c08",
      measurementId: "G-YXS2059BLG"

    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Elements
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const userBox = document.getElementById("userBox");
    const userPhoto = document.getElementById("userPhoto");
    const userName = document.getElementById("userName");
    const userEmail = document.getElementById("userEmail");

    // Login
    loginBtn.addEventListener("click", async () => {
      try {
        const result = await signInWithPopup(auth, provider);

        const user = result.user;

        console.log(user);

      } catch (error) {
        alert(error.message);
      }
    });

    // Logout
    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
    });

    // Auth State
    onAuthStateChanged(auth, (user) => {

      if(user){

        loginBtn.style.display = "none";
        userBox.style.display = "block";

        userPhoto.src = user.photoURL;
        userName.innerText = user.displayName;
        userEmail.innerText = user.email;

      } else {

        loginBtn.style.display = "flex";
        userBox.style.display = "none";

      }

    });
  </script>

</body>
</html>
