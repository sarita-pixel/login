<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Firebase Google Contacts</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#f3f4f6;
  padding:30px;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1{
  margin-bottom:20px;
  color:#222;
}

button{
  padding:14px 22px;
  border:none;
  border-radius:10px;
  background:#4285F4;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  opacity:0.9;
}

.user-box{
  display:flex;
  align-items:center;
  gap:15px;
  margin-top:25px;
  margin-bottom:25px;
  padding:15px;
  background:#f9fafb;
  border-radius:12px;
}

.user-box img{
  width:70px;
  height:70px;
  border-radius:50%;
}

.contacts-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:15px;
}

.contact{
  background:#fafafa;
  padding:16px;
  border-radius:12px;
  border:1px solid #e5e7eb;
}

.contact h3{
  margin-bottom:10px;
  color:#111827;
}

.contact p{
  margin-bottom:6px;
  color:#4b5563;
  word-break:break-word;
}

.loading{
  margin-top:20px;
  color:#555;
}

</style>
</head>
<body>

<div class="container">

  <div class="card">

    <h1>Google Contacts Viewer</h1>

    <button id="loginBtn">
      Sign in with Google
    </button>

    <div class="loading" id="loading"></div>

    <div class="user-box" id="userBox" style="display:none;">
      <img id="userPhoto" src="">
      <div>
        <h2 id="userName"></h2>
        <p id="userEmail"></p>
      </div>
    </div>

    <div class="contacts-grid" id="contacts"></div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// FIREBASE CONFIG
const firebaseConfig = {

      apiKey: "AIzaSyBw1Rfo-MX_7Z4N8BlYuhgxaSJb5p1za5o",
      authDomain: "firstweb-aea54.firebaseapp.com",
      projectId: "firstweb-aea54",
      storageBucket: "firstweb-aea54.firebasestorage.app",
      messagingSenderId: "29706951833",
      appId: "1:29706951833:web:41e1bf9fa0ef9c60ee2c08",
      measurementId: "G-YXS2059BLG"

};


// INIT FIREBASE
const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


// GOOGLE PROVIDER
const provider = new GoogleAuthProvider();


// CONTACTS PERMISSION
provider.addScope(
  "https://www.googleapis.com/auth/contacts.readonly"
);


// ELEMENTS
const loginBtn = document.getElementById("loginBtn");

const loading = document.getElementById("loading");

const contactsDiv = document.getElementById("contacts");

const userBox = document.getElementById("userBox");

const userPhoto = document.getElementById("userPhoto");

const userName = document.getElementById("userName");

const userEmail = document.getElementById("userEmail");


// LOGIN
loginBtn.onclick = async () => {

  try {

    loading.innerHTML = "Logging in...";

    // GOOGLE LOGIN
    const result =
      await signInWithPopup(auth, provider);

    const user = result.user;

    // USER INFO
    userBox.style.display = "flex";

    userPhoto.src = user.photoURL;

    userName.innerText = user.displayName;

    userEmail.innerText = user.email;


    // ACCESS TOKEN
    const credential =
      GoogleAuthProvider.credentialFromResult(result);

    const token = credential.accessToken;

    loading.innerHTML = "Loading contacts...";


    // FETCH CONTACTS
    const response = await fetch(
      "https://people.googleapis.com/v1/people/me/connections?personFields=names,emailAddresses,phoneNumbers",
      {
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    const data = await response.json();

    console.log(data);

    contactsDiv.innerHTML = "";



    // NO CONTACTS
    if(!data.connections){

      contactsDiv.innerHTML =
        "<p>No contacts found.</p>";

      loading.innerHTML = "";

      return;

    }


    // SHOW CONTACTS
    data.connections.forEach(contact => {

      const name =
        contact.names?.[0]?.displayName
        || "No Name";

      const email =
        contact.emailAddresses?.[0]?.value
        || "No Email";

      const phone =
        contact.phoneNumbers?.[0]?.value
        || "No Phone";


      contactsDiv.innerHTML += `

        <div class="contact">

          <h3>${name}</h3>

          <p><strong>Email:</strong><br>${email}</p>

          <p><strong>Phone:</strong><br>${phone}</p>

        </div>

      `;

    });

    loading.innerHTML =
      `Loaded ${data.connections.length} contacts`;

  }

  catch(err){

    console.error(err);

    loading.innerHTML = "";

    alert(err.message);

  }

};

</script>

</body>
</html>
