<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Save Google Contacts to Firebase</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f4f6;
  padding:30px;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1{
  margin-bottom:20px;
}

button{
  padding:14px 20px;
  border:none;
  border-radius:10px;
  background:#4285F4;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

.user{
  margin-top:20px;
  padding:15px;
  background:#f9fafb;
  border-radius:12px;
}

.contact{
  margin-top:12px;
  padding:15px;
  background:#fafafa;
  border-radius:12px;
  border:1px solid #e5e7eb;
}

.status{
  margin-top:20px;
  color:#444;
}

</style>
</head>
<body>

<div class="container">

  <div class="card">

    <h1>Google Contacts → Firebase</h1>

    <button id="loginBtn">
      Login & Save Contacts
    </button>

    <div class="status" id="status"></div>

    <div class="user" id="userBox" style="display:none;">
      <h2 id="userName"></h2>
      <p id="userEmail"></p>
    </div>

    <div id="contacts"></div>

  </div>

</div>

<script type="module">

// FIREBASE IMPORTS
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  collection,
  addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// FIREBASE CONFIG
const firebaseConfig = {
      apiKey: "AIzaSyBw1Rfo-MX_7Z4N8BlYuhgxaSJb5p1za5o",
      authDomain: "firstweb-aea54.firebaseapp.com",
      projectId: "firstweb-aea54",
      appId: "1:29706951833:web:41e1bf9fa0ef9c60ee2c08",

};


// INIT
const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


// GOOGLE PROVIDER
const provider = new GoogleAuthProvider();


// CONTACTS PERMISSION
provider.addScope(
  "https://www.googleapis.com/auth/contacts.readonly"
);


// ELEMENTS
const loginBtn =
  document.getElementById("loginBtn");

const statusDiv =
  document.getElementById("status");

const userBox =
  document.getElementById("userBox");

const userName =
  document.getElementById("userName");

const userEmail =
  document.getElementById("userEmail");

const contactsDiv =
  document.getElementById("contacts");


// LOGIN
loginBtn.onclick = async () => {

  try {

    statusDiv.innerHTML = "Logging in...";


    // GOOGLE LOGIN
    const result =
      await signInWithPopup(auth, provider);

    const user = result.user;


    // SHOW USER
    userBox.style.display = "block";

    userName.innerText =
      user.displayName;

    userEmail.innerText =
      user.email;


    // SAVE USER INFO
    await setDoc(
      doc(db, "users", user.uid),
      {
        uid: user.uid,
        name: user.displayName,
        email: user.email,
        photo: user.photoURL,
        createdAt: new Date()
      }
    );


    // ACCESS TOKEN
    const credential =
      GoogleAuthProvider
      .credentialFromResult(result);

    const token =
      credential.accessToken;


    statusDiv.innerHTML =
      "Loading contacts...";


    // GET CONTACTS
    const response = await fetch(

      "https://people.googleapis.com/v1/people/me/connections?personFields=names,emailAddresses,phoneNumbers",

      {
        headers: {
          Authorization: `Bearer ${token}`
        }
      }

    );


    const data = await response.json();

    console.log(data);


    contactsDiv.innerHTML = "";


    // CHECK CONTACTS
    if(!data.connections){

      statusDiv.innerHTML =
        "No contacts found.";

      return;

    }


    // SAVE CONTACTS
    for(const contact of data.connections){

      const name =
        contact.names?.[0]?.displayName
        || "No Name";

      const email =
        contact.emailAddresses?.[0]?.value
        || "";

      const phone =
        contact.phoneNumbers?.[0]?.value
        || "";


      // SAVE TO FIRESTORE
      await addDoc(

        collection(
          db,
          "users",
          user.uid,
          "contacts"
        ),

        {
          name,
          email,
          phone,
          createdAt: new Date()
        }

      );


      // SHOW CONTACT
      contactsDiv.innerHTML += `

        <div class="contact">

          <h3>${name}</h3>

          <p>Email: ${email || "No Email"}</p>

          <p>Phone: ${phone || "No Phone"}</p>

        </div>

      `;

    }


    statusDiv.innerHTML =

      `Saved ${data.connections.length}
       contacts into Firebase Firestore`;

  }

  catch(err){

    console.error(err);

    statusDiv.innerHTML =
      err.message;

  }

};

</script>

</body>
</html>
